<!--
  Down Payment Help Finder — blog post embed snippet
  ----------------------------------------------------
  Goes IN THE BLOG POST content editor. The tool (down-payment-finder.html)
  is hosted separately and lives inside the iframe below.

  Native <details>/<summary> — no JavaScript, survives BD's script-stripping.
  Same pattern as the Second Look tool's embed snippet.

  Height measured (not guessed): driven via injected JS at 375px width
  through the tallest realistic state (3 program cards — the max that can
  show simultaneously, since the bond and FHA-paired sample programs use
  mutually exclusive credit-score gates), giving 3644px — sized to 3700px
  with margin, biased toward the ceiling per the standing methodology
  since nobody sees the iframe until they've already clicked to open it.

  If Safari shows a stray disclosure triangle, add:
    summary::-webkit-details-marker { display: none; }
-->

<details style="margin: 24px 0; border: none;">
  <summary style="
    cursor: pointer;
    list-style: none;
    display: block;
    background: #403d3d;
    border-left: 4px solid #f76732;
    border-radius: 0 4px 4px 0;
    padding: 40px 32px;
    text-align: center;
  ">
    <span style="
      display: block;
      font-family: 'Barlow Condensed', Arial, sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #f76732;
      margin-bottom: 14px;
    ">Free Interactive Tool</span>

    <span style="
      display: block;
      font-family: 'Barlow Condensed', Arial, sans-serif;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      color: #fffae8;
      margin-bottom: 14px;
      line-height: 1.15;
    ">Find Down Payment Help</span>

    <span style="
      display: block;
      font-family: Georgia, serif;
      font-weight: 300;
      font-size: 17px;
      color: rgba(255,250,232,0.75);
      line-height: 1.6;
      margin-bottom: 28px;
    ">Grants and bond programs can knock thousands off what you need to bring to closing.</span>

    <span style="
      display: inline-block;
      background: #f76732;
      color: #fffae8;
      font-family: 'Barlow Condensed', Arial, sans-serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 18px 32px;
      border-radius: 2px;
    ">Find My Programs &rarr;</span>
  </summary>

  <iframe
    src="https://stewards-tools-max-price-tool.netlify.app/down-payment-finder.html"
    style="width:100%; border:none; display:block; height:3700px;"
    scrolling="auto"
    loading="lazy"
    title="Find Down Payment Help">
  </iframe>
</details>
